<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen install. The manifest carries the maskable SVG for
         Android; iOS ignores manifest icons entirely for Add to Home Screen
         and only reads this PNG, which is rasterised from /icon.svg. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Kmelier" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Warm up the GitHub API + avatar origins before React asks for them -->
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />

    <!-- Single light sheet: chrome color matches the paper token. -->
    <meta name="theme-color" content="#f7f5ef" />

    <title>Chris Kmelier — Developer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Chris Kmelier (Kmelier) — tech enthusiast building useful, experimental and creative projects on the web and beyond."
    />
    <meta name="author" content="Chris Kmelier" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chris Kmelier — Developer Portfolio" />
    <meta
      property="og:description"
      content="Tech enthusiast building useful, experimental and creative projects. Projects, skills and GitHub activity, always in sync."
    />
    <!-- Real 1200x630 social card (public/og.png). Absolute URL because
         crawlers do not resolve relative paths here. -->
    <meta property="og:image" content="https://kmelier.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Chris Kmelier — I build things on the web and beyond. kmelier.vercel.app"
    />
    <meta property="og:url" content="https://kmelier.vercel.app" />
    <meta property="og:site_name" content="Kmelier" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chris Kmelier — Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Tech enthusiast building useful, experimental and creative projects. Projects, skills and GitHub activity, always in sync."
    />
    <meta name="twitter:image" content="https://kmelier.vercel.app/og.png" />
    <meta
      name="twitter:image:alt"
      content="Chris Kmelier — I build things on the web and beyond. kmelier.vercel.app"
    />
  </head>
  <body>
    <!--
    THESIS: The portfolio is one deployable sheet. A compact gold packet stub unfolds into a parallelogram field of proof. It refuses the dark-gradient hero and card grid every dev portfolio ships.
    OWN-WORLD: Matte white sheet, hairline parallelogram crease grid, one gold-foil packet stub, warm-gray mountain and pale-blue valley creases, near-black aerospace-spec type, deep red reserved for LIVE stamps.
    STORY: The visitor reads the statement riding the main diagonal, sees live GitHub stats pinned at crease intersections, scans projects as fold cells, and reaches contact in one calm scroll.
    FIRST VIEWPORT: Gold packet stub top-left; statement large along the main diagonal; three LIVE stats pinned mid-sheet; first project cells below the fold line.
    FORM: Miura-fold deployable sheet, challenger winner of direction round 2, user-approved A+C combination, seed key b8931702.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
